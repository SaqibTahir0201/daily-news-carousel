<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily News Carousel – SaqibTahir0201</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; background: #0f0f1a; color: #fff; text-align: center; padding: 60px 20px; }
  h1 { font-size: 2.5rem; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  p { color: #aaa; font-size: 1.1rem; margin-top: 10px; }
  .posts { margin-top: 40px; display: grid; gap: 16px; max-width: 600px; margin: 40px auto; }
  .post-link { background: #1a1a2e; border: 1px solid #333; border-radius: 12px; padding: 20px; text-decoration: none; color: #fff; transition: 0.2s; }
  .post-link:hover { border-color: #667eea; transform: translateY(-2px); }
  .date { color: #667eea; font-size: 0.9rem; }
</style>
</head>
<body>
  <h1>📰 Daily News Carousel</h1>
  <p>AI-generated daily news posts for LinkedIn & Twitter</p>
  <div class="posts" id="posts">
    <p style="color:#555">Posts will appear here daily...</p>
  </div>
</body>
</html>
